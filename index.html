<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Solar Monitoring</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 8px; }
    .status-badge { display: inline-block; padding: 6px 12px; background: #166534; color: #4ade80; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .card h3 { color: #94a3b8; font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 2.2rem; font-weight: bold; color: #f8fafc; }
    .card .unit { font-size: 1rem; color: #64748b; margin-left: 4px; }
    
    .voltage { border-top: 4px solid #f59e0b; }
    .current { border-top: 4px solid #3b82f6; }
    .power { border-top: 4px solid #10b981; }
    .temp { border-top: 4px solid #ef4444; }
    .humidity { border-top: 4px solid #06b6d4; }
    
    .footer { text-align: center; margin-top: 40px; color: #64748b; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Solar System Realtime Monitoring</h1>
    <div class="status-badge" id="live-status">Tersambung ke Cloud</div>
  </div>

  <div class="grid">
    <div class="card voltage">
      <h3>Voltan Bateri</h3>
      <div><span class="value" id="val-voltage">0.00</span><span class="unit">V</span></div>
    </div>
    
    <div class="card current">
      <h3>Arus Beban</h3>
      <div><span class="value" id="val-current">0.00</span><span class="unit">A</span></div>
    </div>
    
    <div class="card power">
      <h3>Kuasa (Power)</h3>
      <div><span class="value" id="val-power">0.00</span><span class="unit">W</span></div>
    </div>
    
    <div class="card temp">
      <h3>Suhu</h3>
      <div><span class="value" id="val-temp">0.0</span><span class="unit">°C</span></div>
    </div>
    
    <div class="card humidity">
      <h3>Kelembapan</h3>
      <div><span class="value" id="val-humidity">0.0</span><span class="unit">%</span></div>
    </div>
  </div>

  <div class="footer">
    Terakhir Diperbarui: <span id="last-update">-</span>
  </div>

  <script>
    // MASUKKAN BIN ID ANDA DI SINI
    const BIN_ID = "MASUKKAN_BIN_ID_ANDA";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

    async function fetchSolarData() {
      try {
        const response = await fetch(API_URL, {
          headers: {
            'X-Bin-Meta': 'false'
          }
        });

        if (!response.ok) throw new Error('Gagal mengambil data');

        const data = await response.json();
        
        // Ambil data nilai dari JSON
        const voltage = parseFloat(data.voltage || 0);
        const current = parseFloat(data.current || 0);
        const temperature = parseFloat(data.temperature || 0);
        const humidity = parseFloat(data.humidity || 0);
        const power = voltage * current;

        // Update tampilan HTML
        document.getElementById('val-voltage').innerText = voltage.toFixed(2);
        document.getElementById('val-current').innerText = current.toFixed(2);
        document.getElementById('val-power').innerText = power.toFixed(2);
        document.getElementById('val-temp').innerText = temperature.toFixed(1);
        document.getElementById('val-humidity').innerText = humidity.toFixed(1);

        const now = new Date();
        document.getElementById('last-update').innerText = now.toLocaleTimeString();
        document.getElementById('live-status').innerText = "LIVE (Realtime)";
        document.getElementById('live-status').style.background = "#166534";
      } catch (error) {
        console.error("Error fetching data:", error);
        document.getElementById('live-status').innerText = "Terputus / Error";
        document.getElementById('live-status').style.background = "#991b1b";
      }
    }

    // Ambil data otomatis setiap 3 detik
    setInterval(fetchSolarData, 3000);
    fetchSolarData();
  </script>
</body>
</html>
