<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Solar Monitoring</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 8px; }
    .status-badge { display: inline-block; padding: 6px 12px; background: #166534; color: #4ade80; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .card h3 { color: #94a3b8; font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 2.2rem; font-weight: bold; color: #f8fafc; }
    .card .unit { font-size: 1rem; color: #64748b; margin-left: 4px; }

    .solar { border-top: 4px solid #f59e0b; }
    .battery { border-top: 4px solid #10b981; }
    .current { border-top: 4px solid #3b82f6; }
    .power { border-top: 4px solid #8b5cf6; }
    .temp { border-top: 4px solid #ef4444; }
    .humidity { border-top: 4px solid #06b6d4; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Realtime Solar Monitoring System</h1>
    <div class="status-badge" id="status">Sistem Aktif</div>
  </div>

  <div class="grid">
    <div class="card solar">
      <h3>Voltan Solar</h3>
      <div><span class="value" id="solar_v">0.00</span><span class="unit">V</span></div>
    </div>
    <div class="card battery">
      <h3>Voltan Bateri</h3>
      <div><span class="value" id="battery_v">0.00</span><span class="unit">V</span></div>
    </div>
    <div class="card current">
      <h3>Arus (ACS712)</h3>
      <div><span class="value" id="current">0.00</span><span class="unit">A</span></div>
    </div>
    <div class="card power">
      <h3>Kuasa (Power)</h3>
      <div><span class="value" id="power">0.00</span><span class="unit">W</span></div>
    </div>
    <div class="card temp">
      <h3>Suhu</h3>
      <div><span class="value" id="temp">0.0</span><span class="unit">°C</span></div>
    </div>
    <div class="card humidity">
      <h3>Kelembapan</h3>
      <div><span class="value" id="humidity">0.0</span><span class="unit">%</span></div>
    </div>
  </div>

  <script>
    const BIN_ID = "6aea11c0ffd5d16053a31c40";
    const MASTER_KEY = "$2a$10$8WaYL8FLouqj5bL1QiQAxupywEdqYVF1EwFiz87jNg4WH0jVdmnA";

    const URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;

    async function fetchData() {
      try {
        const response = await fetch(URL, {
          headers: {
            "X-Master-Key": MASTER_KEY
          }
        });
        const data = await response.json();
        const record = data.record;

        document.getElementById("solar_v").innerText = Number(record.solar_voltage || 0).toFixed(2);
        document.getElementById("battery_v").innerText = Number(record.battery_voltage || 0).toFixed(2);
        document.getElementById("current").innerText = Number(record.current || 0).toFixed(2);
        document.getElementById("power").innerText = Number(record.power || 0).toFixed(2);
        document.getElementById("temp").innerText = Number(record.temperature || 0).toFixed(1);
        document.getElementById("humidity").innerText = Number(record.humidity || 0).toFixed(1);

        document.getElementById("status").innerText = "Sistem Aktif (Updated)";
        document.getElementById("status").style.background = "#166534";
      } catch (error) {
        console.error("Ralat mengambil data:", error);
        document.getElementById("status").innerText = "Sambungan Terputus";
        document.getElementById("status").style.background = "#991b1b";
      }
    }

    fetchData();
    setInterval(fetchData, 3000);
  </script>
</body>
</html>
